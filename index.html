<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='7' height='7' fill='%23E8DFD6'/%3E%3Crect x='9' width='7' height='7' fill='%23655F5B'/%3E%3Crect y='9' width='7' height='7' fill='%23655F5B'/%3E%3Crect x='9' y='9' width='7' height='7' fill='%23E8DFD6'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#141210; --card:#1F1D1B; --line:rgba(255,255,255,.07);
    --txt:#F1ECEC; --sub:#B7B1B1; --mut:#656363;
    --mono:"Cascadia Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,"Segoe UI Variable","Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);
       display:flex;align-items:center;justify-content:center;overflow:hidden}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:34px;
        animation:fadein .6s ease both}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .mark{display:grid;grid-template-columns:15px 15px;grid-gap:4px}
  .mark i{width:15px;height:15px;border-radius:2px;display:block}
  .mark i:nth-child(1),.mark i:nth-child(4){background:#E8DFD6}
  .mark i:nth-child(2),.mark i:nth-child(3){background:#655F5B}
  h1{font-size:13px;font-weight:600;letter-spacing:.42em;color:var(--sub);
     font-family:var(--mono);text-transform:uppercase;text-indent:.42em;text-align:center}
  .bar{width:220px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:2px;background:#E8DFD6;
         animation:load 1.5s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes load{from{width:4%}to{width:100%}}
  /* chooser */
  #chooser{position:fixed;inset:0;background:var(--bg);display:none;
           flex-direction:column;align-items:center;justify-content:center;gap:44px}
  #chooser.on{display:flex;animation:fadein .45s ease both}
  .cards{display:flex;gap:22px}
  .pick{width:300px;background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:30px 26px;cursor:pointer;color:var(--txt);text-align:left;
        transition:transform .18s ease,border-color .18s ease,background .18s ease}
  .pick:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18);background:#262320}
  .pick .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--mut);
           text-transform:uppercase;margin-bottom:14px}
  .pick .t{font-size:19px;font-weight:650;margin-bottom:8px}
  .pick .d{font-size:12.5px;line-height:1.65;color:var(--sub)}
  .pick.modern .t::after{content:" ●";color:#E8DFD6;font-size:11px;vertical-align:middle}
  .foot{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--mut)}
</style>
</head>
<body>
  <div class="wrap" id="bootwrap">
    <div class="mark"><i></i><i></i><i></i><i></i></div>
    <h1>Notebox</h1>
    <div class="bar"><i></i></div>
  </div>

  <div id="chooser">
    <h1 style="letter-spacing:.42em">Choose your workspace</h1>
    <div class="cards">
      <button class="pick" id="go-classic">
        <div class="k">Retro</div>
        <div class="t">Classic XP</div>
        <div class="d">The full desktop. Bliss wallpaper, draggable windows, taskbar, Paint — everything you remember.</div>
      </button>
      <button class="pick modern" id="go-modern">
        <div class="k">Studio</div>
        <div class="t">Modern</div>
        <div class="d">A quiet, focused space. Dark, minimal, fast — Chat, Guides, Audio, Cards and Sources without the noise.</div>
      </button>
    </div>
    <div class="foot">ESC · CLASSIC &nbsp;&nbsp;|&nbsp;&nbsp; ENTER · MODERN</div>
  </div>

<script>
  setTimeout(() => {
    document.getElementById("bootwrap").style.display = "none";
    const c = document.getElementById("chooser");
    c.classList.add("on");
    document.getElementById("go-classic").addEventListener("click", () => location.href = "classic.html");
    document.getElementById("go-modern").addEventListener("click", () => location.href = "modern.html");
    addEventListener("keydown", function h(e){
      if (!c.classList.contains("on")) return removeEventListener("keydown", h);
      if (e.key === "Escape") location.href = "classic.html";
      if (e.key === "Enter") location.href = "modern.html";
    });
  }, 1600);
</script>
</body>
</html>
